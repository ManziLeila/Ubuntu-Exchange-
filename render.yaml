databases:
  - name: globaltransact-db
    databaseName: globaltransact
    user: gt_user
    plan: free

services:
  # Core API Service
  - type: web
    name: globaltransact-core
    runtime: node
    rootDir: services/core
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: globaltransact-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: globaltransact-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVICE_JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FOREX_SERVICE_URL
        fromService:
          name: globaltransact-forex
          type: web
          property: host
      - key: MOMO_SERVICE_URL
        fromService:
          name: globaltransact-momo
          type: web
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          name: globaltransact-notification
          type: web
          property: host
      - key: STALE_RATE_MINUTES
        value: 15
      - key: FRONTEND_URL
        value: https://globaltransact-web.onrender.com  # update with your actual frontend URL

  # Forex Service
  - type: web
    name: globaltransact-forex
    runtime: node
    rootDir: services/forex
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: REDIS_URL
        fromService:
          name: globaltransact-redis
          type: redis
          property: connectionString
      - key: SERVICE_JWT_SECRET
        fromService:
          name: globaltransact-core
          type: web
          envVarKey: SERVICE_JWT_SECRET
      - key: CORE_SERVICE_URL
        fromService:
          name: globaltransact-core
          type: web
          property: host
      - key: OPEN_EXCHANGE_RATES_APP_ID
        sync: false   # set manually in Render dashboard
      - key: FETCH_INTERVAL_MINUTES
        value: 5
      - key: DEFAULT_SPREAD_RWF_GHS
        value: 0.025
      - key: DEFAULT_SPREAD_RWF_UGX
        value: 0.020
      - key: DEFAULT_SPREAD_RWF_KES
        value: 0.022
      - key: DEFAULT_SPREAD_RWF_USD
        value: 0.030
      - key: DEFAULT_SPREAD_RWF_EUR
        value: 0.030

  # MoMo Service
  - type: web
    name: globaltransact-momo
    runtime: node
    rootDir: services/momo
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: REDIS_URL
        fromService:
          name: globaltransact-redis
          type: redis
          property: connectionString
      - key: SERVICE_JWT_SECRET
        fromService:
          name: globaltransact-core
          type: web
          envVarKey: SERVICE_JWT_SECRET
      - key: CORE_SERVICE_URL
        fromService:
          name: globaltransact-core
          type: web
          property: host
      - key: MOCK_FAILURE_RATE_COLLECT
        value: 0.05
      - key: MOCK_FAILURE_RATE_DISBURSE
        value: 0.03

  # Notification Service
  - type: web
    name: globaltransact-notification
    runtime: node
    rootDir: services/notification
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3004
      - key: REDIS_URL
        fromService:
          name: globaltransact-redis
          type: redis
          property: connectionString
      - key: SERVICE_JWT_SECRET
        fromService:
          name: globaltransact-core
          type: web
          envVarKey: SERVICE_JWT_SECRET
      - key: SENDGRID_API_KEY
        sync: false   # set manually in Render dashboard
      - key: EMAIL_FROM
        value: noreply@globaltransact.com
      - key: EMAIL_FROM_NAME
        value: GlobalTransact

  # Redis
  - type: redis
    name: globaltransact-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # Next.js Frontend (web-v2)
  - type: web
    name: globaltransact-web
    runtime: node
    rootDir: web-v2
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: globaltransact-core
          type: web
          property: host
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          name: globaltransact-core
          type: web
          property: host
