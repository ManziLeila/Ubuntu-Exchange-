events {
  worker_connections 1024;
}

http {
  upstream core    { server globaltransact-core:3001; }
  upstream forex   { server globaltransact-forex:3002; }
  upstream momo    { server globaltransact-momo:3003; }
  upstream notif   { server globaltransact-notification:3004; }
  upstream next    { server globaltransact-next:3000; }


  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

  server {
    listen 443 ssl http2;
    server_name ubuntu-exchange.com;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Docker embedded DNS — defer resolving `next` so nginx starts when the
    # Next.js container is not part of the compose stack (see docker-compose).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Block internal paths from outside
    location ~ ^/internal/ {
      deny all;
      return 403;
    }

    # Socket.io WebSocket upgrade
    location /socket.io/ {
      proxy_pass http://core;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 3600s;
    }

    # Swagger UI
    location /api/docs/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # KYC file uploads serving
    location /uploads/ {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
    }

    # Auth rate limited
    location ~ ^/api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    # Forex routes
    location ~ ^/api/v1/forex/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://forex;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    # GitHub auto-deploy webhook
    location /webhook/deploy {
      proxy_pass http://172.235.166.52:9000/deploy;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Payment webhooks (public — MTN/bank/wise post here)
    location /webhooks/ {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    # All other API routes → core
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    # Frontend (everything else)
    location / {
      proxy_pass http://next;

      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 3600s;
    }
  }
}
