events {
  worker_connections 1024;
}

http {
  upstream core    { server core:3001; }
  upstream forex   { server forex:3002; }
  upstream momo    { server momo:3003; }
  upstream notif   { server notification:3004; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

  server {
    listen 80;
    server_name _;

    # Docker embedded DNS — defer resolving `next` so nginx starts when the
    # Next.js container is not part of the compose stack (see docker-compose).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Block internal paths from outside
    location ~ ^/internal/ {
      deny all;
      return 403;
    }

    # Socket.io WebSocket upgrade
    location /socket.io/ {
      proxy_pass http://core;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 3600s;
    }

    # Swagger UI
    location /api/docs/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # KYC file uploads serving
    location /uploads/ {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
    }

    # Auth rate limited
    location ~ ^/api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    # Forex routes
    location ~ ^/api/v1/forex/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://forex;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    # Payment webhooks (public — MTN/bank/wise post here)
    location /webhooks/ {
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
    }

    # All other API routes → core
    location /api/ {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://core;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 60s;
    }

    # When the Next.js `next` service is disabled in docker-compose, `/` would
    # otherwise 502. Remove this block after enabling the `next` service.
    location = / {
      return 302 /api/docs/;
    }

    # Next.js frontend (optional `next` service). Variable forces runtime DNS
    # lookup so missing `next` does not prevent nginx from starting.
    location / {
      set $next_upstream next:3000;
      proxy_pass http://$next_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
